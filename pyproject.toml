[project]
name = "milaan"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "matcher", "generator", "detective", "scoring", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
