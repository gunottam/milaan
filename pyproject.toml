[project]
name = "milaan"
version = "0.1.0"
requires-python = ">=3.11"

# The detective is optional on purpose. A run without it is §11's ablated
# configuration — a first-class, reported outcome — so the vendor SDKs are extras
# rather than hard dependencies and `detective/provider.py` imports them lazily.
# `pytest -q` passes with or without any of them installed.
#
# `jsonschema` and `python-dotenv` are NOT optional: the Groq path's local
# validator is the guarantee that JSON mode does not give, and it has to run
# whether or not a key is present.
dependencies = ["jsonschema>=4.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
# Groq speaks the OpenAI wire format, so its client is the OpenAI SDK with a
# base_url override — no groq-specific package.
detective = ["openai>=1.40"]
anthropic = ["anthropic>=0.60"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
# `httpx2` is not imported anywhere here — `starlette.testclient` needs it, and
# without it `tests/test_api.py` fails at *collection*, which reads as a broken
# test module rather than a missing package. It is listed because the venv has now
# drifted twice, and both times the missing pieces were things nothing in this
# repo imports by name.
test = ["pytest>=8.0", "httpx2>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "matcher", "generator", "detective", "scoring", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# `pytest -q` runs the fast sweep. `pytest -q -m slow` runs the board set; a `-m`
# on the command line replaces this one rather than adding to it, so `-m slow`
# and `-m ""` (everything) both work.
addopts = "-m 'not slow'"
markers = [
  "slow: needs the full 134-line seed-42 board. Six of these run an uncapped ladder at ~45 s each, so they are opt-in — see tests/conftest.py::pytest_collection_modifyitems. Stage 14's regression MUST run them.",
]
